[project]
name = "algo-visualizer-api"
version = "0.1.0"
description = "Backend for the Open Source Trading Strategy Visualizer"
requires-python = ">=3.10"

[tool.poetry]
name = "algo-visualizer-api"
version = "0.1.0"
description = ""
authors = ["Open Source"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
vectorbt = "^0.25.0"
yfinance = "^0.2.36"
ccxt = "^4.2.19"
pandas = "^2.2.0"
redis = "^5.0.1"
celery = "^5.3.6"
numpy = "<2.0.0" 

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
